[project]
name = "zip2info"
version = "1.1.0"
description = "Fast US ZIP code lookups for timezone and geocoordinates"
readme = "README.md"
authors = [
    { name = "kylehogate", email = "kyle.holgate@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    "scripts/**",
    "data/**",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    # Build-time only: scripts/compile_data.py derives timezones from ZIP
    # centroids. The published package stays dependency-free.
    "timezonefinder>=6.5.0",
]
